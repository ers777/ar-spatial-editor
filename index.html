<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Hand Engine</title>
    <style>
      html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
      #video {
        position: fixed; inset: 0;
        width:100%; height:100%;
        object-fit: cover;
        transform: scaleX(-1); /* зеркало для селфи */
        z-index: 0;
      }
      canvas {
        position: fixed; inset: 0;
        width:100%; height:100%;
        z-index: 1;
        pointer-events: none;
      }
      #hud{
        position:fixed; left:12px; top:12px; z-index:2;
        color:white; font-family: monospace; font-size:14px;
        background: rgba(0,0,0,0.35); padding:8px 10px; border-radius:10px;
      }
    </style>
  </head>
  <body>
    <video id="video" autoplay playsinline muted></video>
    <div id="hud">Loading…</div>
    <canvas class="canvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
